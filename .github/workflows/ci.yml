name: CI - Lint e Testes

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  testes:
    name: Rodar Testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests pytest pytest-cov

      - name: Rodar testes
        run: python -m pytest test_integracao.py -v --tb=short